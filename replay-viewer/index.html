<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Garble — Replay</title>
<link rel="stylesheet" href="./chrome.css">
</head>
<body>
<div id="layout">
  <div id="stage">
    <div id="topband">
      <div id="wordmark">GAR<span>BLE</span></div>
      <div id="clock">TURN 0</div>
      <div id="topright">
        <span id="statuschip">replay</span>
        <button id="feedtoggle">LOG »</button>
      </div>
    </div>
    <div id="scorebug"></div>
    <div id="board-wrap">
      <canvas id="table" width="960" height="640"></canvas>
      <div id="lightpool"></div>
      <div id="grain"></div>
      <div id="endscreen"></div>
    </div>
    <div id="transport">
      <div class="scrub" id="scrub"></div>
      <div class="tbar">
        <button class="tbtn" id="play">❚❚</button>
        <span class="tpos" id="pos">0 / 0</span>
      </div>
    </div>
    </div>
  <div id="feed"></div>
</div>
<div id="loading">LOADING REPLAY…</div>
<script src="./chrome_common.js"></script>
<script src="./renderer.js"></script>
<script src="./garble_replay.js"></script>
<script src="./static_replay.js"></script>
<script>
  var canvas = document.getElementById("table");
  function fit() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  fit();
  GarbleRenderer.bindFeedToggle(document.getElementById("feedtoggle"), true);
  // attach happens in static_replay.js once the wasm module loads
</script>

<!-- ==================================================================== -->
<!-- GARBLE additions to the inherited cogame-babel chrome.               -->
<!-- Everything above this banner is cogame-babel/replay-viewer/index.html -->
<!-- with only the identifier renames a fork requires. Nothing above is    -->
<!-- removed or edited; Garble only appends. The block inserts two things  -->
<!-- into the existing chrome: the ♪ STATIC button, INSIDE the existing    -->
<!-- .tbar (never overlaid on the transport band), and the commodity       -->
<!-- legend strip above the transport. Audio is off by default and never   -->
<!-- gates data-replay-loaded.                                            -->
<!-- ==================================================================== -->
<script>
  (function () {
    var tbar = document.querySelector("#transport .tbar");
    if (tbar) {
      var staticBtn = document.createElement("button");
      staticBtn.className = "tbtn";
      staticBtn.id = "staticbtn";
      staticBtn.type = "button";
      staticBtn.textContent = "\u266a STATIC";
      tbar.appendChild(staticBtn);
    }
    var stage = document.getElementById("stage");
    var transport = document.getElementById("transport");
    if (stage && transport && !document.getElementById("legend")) {
      var legend = document.createElement("div");
      legend.id = "legend";
      stage.insertBefore(legend, transport);
    }
    if (window.GarbleChrome) window.GarbleChrome.relayout();
  })();
</script>
</body>
</html>
